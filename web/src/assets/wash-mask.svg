<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" preserveAspectRatio="none">
  <!--
    Alpha mask for OHM ink-wash panels. The rectangle is blurred, then pushed
    around by fractal noise, so the panel edge thins out unevenly like pigment
    soaking into paper instead of stopping at a stroke.
  -->
  <filter id="wash" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="4" seed="11" result="noise" />
    <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="soft" />
    <feDisplacementMap in="soft" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <rect x="8" y="8" width="284" height="284" fill="#ffffff" filter="url(#wash)" />
</svg>
